[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-oa-progression-synthesis"
version = "0.1.0"
description = "Modular framework for Hand Osteoarthritis progression synthesis using CycleGAN and Diffusion models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["hand_oa*", "cyclegan*", "diffusion*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
