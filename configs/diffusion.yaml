# Starter configuration for the next-phase Diffusion track
# Reuses configs/data.yaml and src/hand_oa/ data + split + evaluation pipelines.

experiment:
  name: diffusion_dip_kl_progression
  output_dir: outputs/diffusion
  seed: 42

data:
  joints: [DIP2, DIP3, DIP4, DIP5]
  kl_grades: [0, 1, 2, 3, 4]
  image_size: 256
  in_channels: 1
  batch_size: 16
  num_workers: 4

model:
  architecture: conditional_ddpm
  num_train_timesteps: 1000
  beta_schedule: linear
  guidance_scale: 3.0

training:
  epochs: 200
  lr: 0.0001
  save_every_epochs: 10
